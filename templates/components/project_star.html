{% with target=project|default:experience %}
<form method="post" action="{% url 'main:toggle_star' target.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in target.starred_by.all %} is-starred{% endif %}"
            title="{% if target.starred_by.all %}Dibintangi oleh {{ target.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in target.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ target.starred_by.count }}</span>
    </button>
</form>
{% endwith %}
